<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel · Gestión</title>
  <meta name="theme-color" content="#15101f" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand-row">
        <div class="brand-mark">P</div>
        <div>
          <strong>Pixel</strong>
          <span>Gestión</span>
        </div>
      </div>

      <nav class="nav-group" aria-label="Principal">
        <button class="nav-link active" data-view="inicio"><span>⌂</span> Inicio</button>
        <button class="nav-link" data-view="pedidos"><span>▤</span> Pedidos</button>
        <button class="nav-link" data-view="clientes"><span>♙</span> Clientes</button>
        <button class="nav-link" data-view="productos"><span>□</span> Productos</button>
        <button class="nav-link" data-view="insumos"><span>◇</span> Insumos</button>
        <button class="nav-link" data-view="caja"><span>$</span> Caja</button>
        <button class="nav-link" data-view="biblioteca"><span>▣</span> Biblioteca</button>
      </nav>

      <div class="sidebar-bottom">
        <div class="sidebar-label">Versión anterior</div>
        <a href="../pedidos.html" class="legacy-link">Abrir Pixel clásica ↗</a>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir menú">☰</button>
        <div>
          <h1 id="pageTitle">Inicio</h1>
          <p id="pageSubtitle">Lo importante de Pixel, sin vueltas.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn primary" id="globalNewOrderBtn">+ Nuevo pedido</button>
        </div>
      </header>

      <main class="content" id="appContent"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <div>
        <span class="eyebrow" id="drawerEyebrow"></span>
        <h2 id="drawerTitle"></h2>
      </div>
      <button class="icon-btn" id="drawerCloseBtn" aria-label="Cerrar">×</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-footer" id="drawerFooter"></div>
  </aside>

  <div class="toast-stack" id="toastStack"></div>
  <datalist id="clientesList"></datalist>
  <datalist id="productosList"></datalist>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
